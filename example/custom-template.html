<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}} - 自定义模板示例</title>
  <style>
    body {
      font-family: "Microsoft YaHei", sans-serif;
      line-height: 1.7;
      color: #333;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      background-color: #f9f9f9;
    }
    header {
      background-color: #4a6baf;
      color: white;
      padding: 20px;
      text-align: center;
      border-radius: 5px;
      margin-bottom: 30px;
    }
    footer {
      margin-top: 40px;
      padding: 20px;
      text-align: center;
      border-top: 1px solid #eee;
      color: #777;
    }
    h1, h2, h3, h4, h5, h6 {
      color: #2c3e50;
    }
    a {
      color: #1e88e5;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    pre {
      background-color: #f5f7f9;
      border-left: 4px solid #4a6baf;
      padding: 15px;
      overflow: auto;
    }
    blockquote {
      background-color: #f5f7f9;
      border-left: 5px solid #4a6baf;
      padding: 10px 20px;
      margin: 20px 0;
    }
    img {
      max-width: 100%;
      display: block;
      margin: 0 auto;
      border-radius: 5px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 25px 0;
    }
    table, th, td {
      border: 1px solid #ddd;
    }
    th, td {
      padding: 12px 15px;
      text-align: left;
    }
    th {
      background-color: #4a6baf;
      color: white;
    }
    tr:nth-child(even) {
      background-color: #f5f7f9;
    }
    
    /* 自定义样式将被插入到这里 */
    /* {{customStyle}} */
  </style>
</head>
<body>
  <header>
    <h1>{{title}}</h1>
    <p>使用自定义模板展示的Markdown文件</p>
  </header>
  
  <main>
    {{content}}
  </main>
  
  <footer>
    <p>这是一个自定义模板示例 | 使用MD到HTML转换工具生成</p>
    <p>© 2023 示例公司</p>
  </footer>
</body>
</html>
